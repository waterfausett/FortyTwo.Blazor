# Which changed files each CI workflow covers. The changes job in worker.yml and mobile.yml reads
# this to decide whether to test (and, for the Worker, deploy).
shared: &shared
  - 'packages/**'
  - 'package.json'
  - 'package-lock.json'
  - '.github/path-filters.yml'

worker:
  - *shared
  - 'apps/worker/**'
  - 'apps/web/**'
  - 'version.txt' # so the worker release PR, which only changes this, runs the tests
  - '.github/workflows/worker.yml'

mobile:
  - *shared
  - 'apps/mobile/**'
  - '.github/workflows/mobile.yml'
