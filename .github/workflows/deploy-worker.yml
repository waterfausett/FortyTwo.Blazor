name: Deploy Worker

# Builds the web app, applies any new D1 migrations, and deploys the Worker, which serves the web
# app too. Release Please runs this when it publishes a worker release; run it by hand from the
# Actions tab to deploy the chosen branch without a release.
on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: deploy-worker

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true # the bot's weights (apps/web/public/models/*.bin) are Git LFS objects
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Vite bakes these into the bundle, so they're repository variables, not secrets. The API and
      # WebSocket origins are left unset: the Worker serves the app, so both are the page's origin.
      - run: npm run build -w @fortytwo/web
        env:
          VITE_AUTH0_DOMAIN: ${{ vars.AUTH0_DOMAIN }}
          VITE_AUTH0_CLIENT_ID: ${{ vars.AUTH0_CLIENT_ID }}
          VITE_AUTH0_AUDIENCE: ${{ vars.AUTH0_AUDIENCE }}
      - run: npx wrangler d1 migrations apply fortytwo --remote
        working-directory: apps/worker
      - run: npx wrangler deploy
        working-directory: apps/worker
