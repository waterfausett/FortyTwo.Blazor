name: Lint PR Title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  lint:
    name: Conventional Commit title
    # Release Please titles its own PRs (chore(master): release worker 1.2.0).
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      # release-please reads the squash-merge commit subject, which GitHub seeds from the PR title.
      # This keeps that title parseable (feat(mobile):, fix(worker):, feat!: ...). The scope is
      # optional, and only for the changelog: release-please picks the release (worker or mobile)
      # from the files a commit changes.
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          scopes: |
            worker
            web
            mobile
            eas
            packages
            ml
            blazor
            docker
            github
            claude
            deps
