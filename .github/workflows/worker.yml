name: Worker

# Tests the Worker and web app on every pull request and push that can affect them. On a push to
# master (or a manual run), it then builds the web app, applies any new D1 migrations, and deploys
# the Worker, which serves the web app too.
#
# The shared paths (packages, root package files) are duplicated in mobile.yml; keep them in sync.
on:
  push:
    branches: [master]
    paths: &paths
      - 'cloudflare/apps/worker/**'
      - 'cloudflare/apps/web/**'
      - 'cloudflare/packages/**'
      - 'cloudflare/package.json'
      - 'cloudflare/package-lock.json'
      - '.github/workflows/worker.yml'
  # Every pull request, so the required check below always reports; see the changes job.
  pull_request:
  workflow_dispatch:

concurrency:
  group: worker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: cloudflare

jobs:
  # Pull requests run this workflow whatever they touch, so this job skips the tests when nothing
  # they cover changed. Its filter mirrors the push paths above; keep them in sync.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      worker: ${{ steps.filter.outputs.worker }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            worker:
              - 'cloudflare/apps/worker/**'
              - 'cloudflare/apps/web/**'
              - 'cloudflare/packages/**'
              - 'cloudflare/package.json'
              - 'cloudflare/package-lock.json'
              - '.github/workflows/worker.yml'

  test:
    needs: changes
    if: ${{ !cancelled() && !failure() && (github.event_name != 'pull_request' || needs.changes.outputs.worker == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: npm ci
      - run: npm test -w @fortytwo/rules
      - run: npm test -w @fortytwo/client
      - run: npm test -w @fortytwo/worker
      - run: npm test -w @fortytwo/web
      # Typechecks the web app and the packages it references.
      - run: npm run build -w @fortytwo/web

  deploy:
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: npm ci
      # Vite bakes these into the bundle, so they're repository variables, not secrets. The API and
      # WebSocket origins are left unset: the Worker serves the app, so both are the page's origin.
      - run: npm run build -w @fortytwo/web
        env:
          VITE_AUTH0_DOMAIN: ${{ vars.AUTH0_DOMAIN }}
          VITE_AUTH0_CLIENT_ID: ${{ vars.AUTH0_CLIENT_ID }}
          VITE_AUTH0_AUDIENCE: ${{ vars.AUTH0_AUDIENCE }}
      - run: npx wrangler d1 migrations apply fortytwo --remote
        working-directory: cloudflare/apps/worker
      - run: npx wrangler deploy
        working-directory: cloudflare/apps/worker

  # The check the master ruleset requires. A skipped job counts as passing, so this fails only when
  # one of the jobs above failed or was cancelled.
  ci:
    name: Worker CI
    if: always()
    needs: [changes, test]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
        working-directory: .
