name: Worker

# Tests the Worker and web app on every pull request that can affect them, release PRs included.
# Deploys happen on a worker release (release-please.yml, which runs deploy-worker.yml).
#
# Which changes count as affecting it is defined in .github/path-filters.yml.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: worker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: cloudflare

jobs:
  # The workflow runs on every pull request so the required check below always reports.
  # This job skips the rest when nothing it covers changed.
  changes:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      worker: ${{ steps.filter.outputs.worker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: .github/path-filters.yml

  test:
    needs: changes
    if: ${{ !cancelled() && !failure() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.worker == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: npm ci
      - run: npm test -w @fortytwo/rules
      - run: npm test -w @fortytwo/client
      - run: npm test -w @fortytwo/bot
      - run: npm test -w @fortytwo/worker
      - run: npm test -w @fortytwo/web
      # Typechecks the web app and the packages it references (rules, api-types, client).
      - run: npm run build -w @fortytwo/web
      # vitest doesn't typecheck, and the web build doesn't reach these two.
      - run: npm run typecheck -w @fortytwo/worker -w @fortytwo/bot
      - run: npm run lint -w @fortytwo/web

  # The check the master ruleset requires. A skipped job counts as passing, so this fails only when
  # one of the jobs above failed or was cancelled.
  ci:
    name: Worker CI
    if: always()
    needs: [changes, test]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
        working-directory: .
