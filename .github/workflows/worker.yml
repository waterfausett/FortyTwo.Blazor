name: Worker

# Tests the Worker and web app on every pull request and push that can affect them. On a push to
# master (or a manual run), it then builds the web app, applies any new D1 migrations, and deploys
# the Worker, which serves the web app too.
#
# Which changes count as affecting it is defined in .github/path-filters.yml.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: worker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: cloudflare

jobs:
  # The workflow runs on every push and pull request so the required check below always reports.
  # This job skips the rest when nothing it covers changed.
  changes:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      worker: ${{ steps.filter.outputs.worker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: .github/path-filters.yml

  test:
    needs: changes
    if: ${{ !cancelled() && !failure() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.worker == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: npm ci
      - run: npm test -w @fortytwo/rules
      - run: npm test -w @fortytwo/client
      - run: npm test -w @fortytwo/bot
      - run: npm test -w @fortytwo/worker
      - run: npm test -w @fortytwo/web
      # Typechecks the web app and the packages it references.
      - run: npm run build -w @fortytwo/web

  deploy:
    needs: test
    # A manual run skips `changes`, and a skipped ancestor skips this job too unless the condition
    # checks results itself, so require the test job's success explicitly.
    if: ${{ !cancelled() && needs.test.result == 'success' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')) }}
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true # the bot's weights (apps/web/public/models/*.bin) are Git LFS objects
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: npm ci
      # Vite bakes these into the bundle, so they're repository variables, not secrets. The API and
      # WebSocket origins are left unset: the Worker serves the app, so both are the page's origin.
      - run: npm run build -w @fortytwo/web
        env:
          VITE_AUTH0_DOMAIN: ${{ vars.AUTH0_DOMAIN }}
          VITE_AUTH0_CLIENT_ID: ${{ vars.AUTH0_CLIENT_ID }}
          VITE_AUTH0_AUDIENCE: ${{ vars.AUTH0_AUDIENCE }}
      - run: npx wrangler d1 migrations apply fortytwo --remote
        working-directory: cloudflare/apps/worker
      - run: npx wrangler deploy
        working-directory: cloudflare/apps/worker

  # The check the master ruleset requires. A skipped job counts as passing, so this fails only when
  # one of the jobs above failed or was cancelled.
  ci:
    name: Worker CI
    if: always()
    needs: [changes, test]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
        working-directory: .
