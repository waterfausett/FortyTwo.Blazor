name: Release Please

# Keeps a release PR open for each of the worker (Worker + web app) and the mobile app, built from
# the Conventional Commit subjects merged to master since its last release. Merging a release PR
# tags that commit (worker-v1.2.0, mobile-v0.2.0), publishes the GitHub Release, and ships it:
# the worker deploys from here, and the mobile tag starts an EAS preview build
# (apps/mobile/.eas/workflows/deploy-preview-builds.yml).
#
# What belongs to which release is set in release-please-config.json.
on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release PRs / GitHub Releases
    runs-on: ubuntu-latest
    outputs:
      worker: ${{ steps.release.outputs.release_created }}
    steps:
      # Acts as the release GitHub App, not the default GITHUB_TOKEN: GitHub doesn't start
      # workflows for what GITHUB_TOKEN does, so CI wouldn't run on the release PRs. With the
      # app's token they're tested like any other PR. Each release PR is rebuilt from master on
      # every run (always-update), so its checks test exactly what the release ships.
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  deploy-worker:
    needs: release-please
    if: needs.release-please.outputs.worker == 'true'
    uses: ./.github/workflows/deploy-worker.yml
    secrets: inherit
