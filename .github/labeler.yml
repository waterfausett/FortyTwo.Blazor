# Path-based PR labels, applied by .github/workflows/labeler.yml
# Format: actions/labeler v5 — https://github.com/actions/labeler
# Labels stack: a PR touching packages/rules/test/ gets both `packages` and `tests`.

claude:
  - changed-files:
      - any-glob-to-any-file:
          - '.claude/**'
          - '**/CLAUDE.md'
          - '**/AGENTS.md'

github:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'

worker:
  - changed-files:
      - any-glob-to-any-file:
          - 'apps/worker/**'

web:
  - changed-files:
      - any-glob-to-any-file:
          - 'apps/web/**'

mobile:
  - changed-files:
      - any-glob-to-any-file:
          - 'apps/mobile/**'

packages:
  - changed-files:
      - any-glob-to-any-file:
          - 'packages/**'
          - 'package.json'
          - 'package-lock.json'

# Not `eas-build`: that label asks EAS to start a build, so it stays a manual choice.
eas:
  - changed-files:
      - any-glob-to-any-file:
          - 'apps/mobile/.eas/**'
          - 'apps/mobile/eas.json'
          - 'apps/mobile/app.json'
          - 'apps/mobile/app.config.js'

ml:
  - changed-files:
      - any-glob-to-any-file:
          - 'ml/**'

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/**'
          - '**/README.md'


tests:
  - changed-files:
      - any-glob-to-any-file:
          - '**/test/**'
          - '**/tests/**'
          - '**/__tests__/**'
          - '**/*.test.ts'
          - '**/*.test.tsx'
