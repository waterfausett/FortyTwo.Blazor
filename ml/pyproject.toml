[project]
name = "fortytwo-ml"
version = "0.1.0"
description = "Self-play ML bots for Texas 42"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.1",
  "pyyaml>=6.0",
  "tensorboard>=2.18",
  "torch>=2.7",
]

[project.scripts]
ml = "fortytwo_ml.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fortytwo_ml"]

# CUDA wheels where training happens (the Windows dev box, RTX 2070 SUPER); CPU wheels everywhere
# else, including CI.
[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
  { index = "pytorch-cpu", marker = "sys_platform != 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
