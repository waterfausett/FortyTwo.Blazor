name = "fortytwo-worker"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# Served at fortytwo-worker.<account>.workers.dev. For a custom domain, add
# `routes = [{ pattern = "42.example.com", custom_domain = true }]`.
workers_dev = true

# The web app's build is served from this same Worker, so the API and the SPA share an origin. The
# Worker runs first only for its own paths; any other path is a static file, or index.html so the
# SPA's router can handle deep links like /match/:id. Build the web app before deploying.
[assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/matches/*", "/health"]

[[durable_objects.bindings]]
name = "MATCH_DO"
class_name = "MatchDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MatchDO"]

[[d1_databases]]
binding = "DB"
#binding = "fortytwo"
database_name = "fortytwo"
database_id = "6a67995e-c52b-4c25-aa7a-7a07964fc5a3"