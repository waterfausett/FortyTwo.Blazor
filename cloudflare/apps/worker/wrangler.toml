name = "fortytwo-worker"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# Served at fortytwo-worker.<account>.workers.dev. For a custom domain, add
# `routes = [{ pattern = "42.example.com", custom_domain = true }]`.
workers_dev = true

# The web app's build is served from this same Worker, so the API and the SPA share an origin. The
# Worker runs first only for its own paths; any other path is a static file, or index.html so the
# SPA's router can handle deep links like /match/:id. Build the web app before deploying.
# /.well-known/* is the Worker's so a missing assetlinks.json is a 404, not the SPA's index.html.
[assets]
# The bot's weights (/models/bot.{json,bin}) are read through this binding (mlBot.ts).
binding = "ASSETS"
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/matches/*", "/health", "/.well-known/*"]

# Daily at 09:00 UTC: delete active matches idle for 14 days (src/expiry.ts).
[triggers]
crons = ["0 9 * * *"]

[[durable_objects.bindings]]
name = "MATCH_DO"
class_name = "MatchDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MatchDO"]

[[d1_databases]]
binding = "DB"
#binding = "fortytwo"
database_name = "fortytwo"
database_id = "6a67995e-c52b-4c25-aa7a-7a07964fc5a3"

[vars]
# preview build SHA256 Fingerprint
ANDROID_APP_FINGERPRINTS = "F5:66:A5:52:7F:C5:F8:AC:F9:25:EB:89:56:1B:2E:8E:EA:76:97:62:AD:6C:1B:D6:EB:43:3F:08:15:77:31:3E"